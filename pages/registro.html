<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cine Aurora 📽️ - Registro</title>
    <link rel="icon" href="../assets/favicon/logo-cine.png" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <header>
      <div>
        <h1>Cine Aurora</h1>
        <img src="../assets/favicon/logo-cine.png" alt="logo-cine-aurora" />
      </div>
      <nav>
        <a href="../index.html">Inicio</a>
        <a href="./estrenos.html">Próximos estrenos</a>
        <a href="../index.html">Volver</a>
      </nav>
    </header>

    <main class="registro-main">
      <form action="login.html" class="registro-form">
        <h2>Crear nueva cuenta</h2>

        <div class="input-group">
          <label>Nombre Completo</label>
          <input type="text" required placeholder="Ej: John Doe" />
        </div>

        <div class="input-group">
          <label>Email</label>
          <input type="email" required placeholder="usuario@ejemplo.com" />
        </div>

        <div class="input-row">
          <div class="input-group">
            <label>Contraseña</label>
            <input type="password" required />
          </div>
          <div class="input-group">
            <label>Confirmar contraseña</label>
            <input type="password" required />
          </div>
        </div>

        <div class="input-group">
          <label>Fecha de nacimiento</label>
          <input type="date" required />
        </div>

        <hr />

        <section class="preferencias-seccion">
          <h3>Datos para ayudar al cine</h3>
          <p>Ayúdanos a mejorar tu experiencia.</p>

          <div class="input-row">
            <div class="input-group">
              <label>Color de butacas</label>
              <input type="color" />
            </div>
            <div class="input-group">
              <label>Entradas habituales (0-10)</label>
              <input type="range" min="0" max="10" />
            </div>
          </div>

          <div class="input-group">
            <label>Género favorito</label>
            <select>
              <option>Acción</option>
              <option>Drama</option>
              <option>Ciencia ficción</option>
              <option>Terror</option>
            </select>
          </div>
        </section>

        <button type="submit" class="btn btn-primario">Regístrate</button>
      </form>
    </main>

    <footer>
      <p>&copy; 2026 Cine Aurora - Todos los derechos reservados</p>
    </footer>
  </body>
</html>
